<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Google Search Console — Vérification Aevyra</title>
    <!-- Fichier de vérification Google Search Console -->
    <!-- À remplacer par le fichier HTML fourni par Google lors de la vérification -->
    <!-- Étapes : Search Console > Ajouter une propriété > Méthode "fichier HTML" > Télécharger ce fichier -->
    <meta name="google-site-verification" content="aevyra-google-verify-token" />
  </head>
  <body>
    google-site-verification: google-aevyra-verify.html
  </body>
</html>
